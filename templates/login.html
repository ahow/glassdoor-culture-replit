<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in | Culture Analytics Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 100%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 1rem;
        }
        .card {
            background: #fff; border-radius: 16px; padding: 2.5rem;
            width: 100%; max-width: 420px; box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { font-size: 1.4rem; color: #0f172a; margin-bottom: 0.35rem; }
        .sub { color: #64748b; font-size: 0.875rem; margin-bottom: 1.75rem; }
        label { display: block; font-size: 0.8125rem; font-weight: 600; color: #334155; margin-bottom: 0.35rem; }
        input {
            width: 100%; padding: 0.65rem 0.85rem; border: 1px solid #cbd5e1; border-radius: 8px;
            font-size: 0.9rem; margin-bottom: 1rem;
        }
        input:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.15); }
        button {
            width: 100%; padding: 0.7rem; background: #2563eb; color: #fff; border: none;
            border-radius: 8px; font-size: 0.95rem; font-weight: 600; cursor: pointer;
        }
        button:hover { background: #1d4ed8; }
        button:disabled { opacity: 0.6; cursor: default; }
        .error { color: #dc2626; font-size: 0.85rem; margin-bottom: 1rem; display: none; }
        .switch { text-align: center; margin-top: 1.25rem; font-size: 0.85rem; color: #64748b; }
        .switch a { color: #2563eb; cursor: pointer; font-weight: 600; text-decoration: none; }
        .note { font-size: 0.78rem; color: #94a3b8; margin-top: 1rem; text-align: center; }
    </style>
</head>
<body>
    <div class="card">
        <h1 id="formTitle">Sign in</h1>
        <p class="sub">Culture Analytics Dashboard</p>
        <div class="error" id="errorMsg" data-testid="text-auth-error"></div>
        <form id="authForm">
            <label for="email">Email</label>
            <input type="email" id="email" data-testid="input-email" placeholder="you@schroders.com" required autocomplete="username">
            <label for="password">Password</label>
            <input type="password" id="password" data-testid="input-password" placeholder="Password" required autocomplete="current-password">
            <button type="submit" id="submitBtn" data-testid="button-submit">Sign in</button>
        </form>
        <div class="switch" id="switchRow">
            No account yet? <a onclick="toggleMode()" data-testid="link-toggle-mode" id="toggleLink">Create one</a>
        </div>
        <p class="note" id="domainNote" style="display: none;">Accounts are limited to @schroders.com email addresses.</p>
    </div>
    <script>
        let mode = 'login';
        function toggleMode() {
            mode = mode === 'login' ? 'register' : 'login';
            document.getElementById('formTitle').textContent = mode === 'login' ? 'Sign in' : 'Create account';
            document.getElementById('submitBtn').textContent = mode === 'login' ? 'Sign in' : 'Create account';
            document.getElementById('toggleLink').textContent = mode === 'login' ? 'Create one' : 'Sign in instead';
            document.getElementById('switchRow').childNodes[0].textContent = mode === 'login' ? 'No account yet? ' : 'Already have an account? ';
            document.getElementById('domainNote').style.display = mode === 'register' ? 'block' : 'none';
            document.getElementById('errorMsg').style.display = 'none';
        }
        document.getElementById('authForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const err = document.getElementById('errorMsg');
            err.style.display = 'none';
            btn.disabled = true;
            try {
                const res = await fetch(mode === 'login' ? '/api/auth/login' : '/api/auth/register', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        email: document.getElementById('email').value,
                        password: document.getElementById('password').value
                    })
                });
                const data = await res.json();
                if (data.success) {
                    window.location.href = '/';
                } else {
                    err.textContent = data.error || 'Something went wrong. Please try again.';
                    err.style.display = 'block';
                }
            } catch (e2) {
                err.textContent = 'Could not reach the server. Please try again.';
                err.style.display = 'block';
            }
            btn.disabled = false;
        });
    </script>
</body>
</html>
